name: Pytest on Push

# Runs on the push or pull request of 
# A python, yaml, pyproject, and uv lock file
on:
  push:
    paths:
      - "**.py" 
      - "**.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "**.py"
      - "**.yml"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.14"]

    steps:
      - name: Copies over repo
        uses: actions/checkout@v7

      - name: Install uv and setup python version
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: |
          uv sync --locked --all-extras --dev

      - name: Run pytest
        run: |
          uv run pytest

  all-tests-pass:
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All Pytest Passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            exit 1
          fi
