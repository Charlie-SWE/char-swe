[project]
name = "char-swe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.1.1",
    "streamlit>=1.62.0",
    "requests",
    "python-dotenv",
    "nicegui>=3.18.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "sqlfluff>=4.4.0",
]

[tool.black]
line-length = 60

[tool.sqlfluff.core]
dialect = "sqlite"
max_line_length = 60

[tool.sqlfluff.indentation]
tab_space_size = 4

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
